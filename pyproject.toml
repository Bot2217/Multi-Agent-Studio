[project]
name = "ulei"
version = "0.1.0"
description = "Улей — многоагентная студия"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Bot2217" }]
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.40.0",
  "litellm>=1.50.0",
  "python-dotenv>=1.0.0",
  "wakepy>=0.9.0",
  "paramiko>=3.0.0",
  "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["build", "dist", "desktop/node_modules", "desktop/src-tauri/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"cli.py" = ["E402"]
"tools/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
