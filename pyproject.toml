[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["build", "dist", "desktop/node_modules", "desktop/src-tauri/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]
"cli.py" = ["E402"]
"tools/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
