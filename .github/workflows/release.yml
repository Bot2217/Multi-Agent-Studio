name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "app.py"
      - "core/**"
      - "tools/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages for Tauri
        run: bash desktop/ci-apt.sh
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Build an AppImage
        working-directory: desktop
        run: npm run tauri build -- --bundles appimage

  macos-sign:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Build the signed app
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app
      - name: Verify the ad-hoc signature
        run: bash desktop/verify-macos-sign.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: bash desktop/ci-apt.sh
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Put the updater public key into the build
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 desktop/inject_updater_key.py --require
      - name: Use an ad-hoc Apple signing identity
        if: matrix.os == 'macos-latest'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Publish a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Улей ${{ github.ref_name }}
          releaseBody: |
            Обновление для установленной 0.1.1 приходит само: при запуске «Улей» предложит «Установить и перезапустить».

            Установщик больше не встаёт с ошибкой «Error opening file for writing … ulei-backend.exe», если программа или её фоновый движок ещё запущены. Перед заменой файлов закрывается только эта копия: ulei.exe и ulei-backend.exe в папке установки. Если файл всё ещё занят, установка останавливается с объяснением и не оставляет программу наполовину. Настройки в %APPDATA%\ulei и локальные модели не удаляются.

            Что ещё изменилось с 0.1.1:
            - Каталог локальных моделей: поиск, квантизация, проверка RAM/VRAM, пауза и отмена скачивания.
            - Движок v2: независимые роли одной волны идут параллельно, есть таймаут и отмена.
            - Рядом со Streamlit поднимается локальный API. Он слушает только 127.0.0.1 и требует одноразовый токен.
            - Роль может подключить MCP-сервер по stdio или HTTP.
            - Если системное хранилище паролей отвечает, ключи провайдеров уходят из .env туда.

            Это патч 0.1.2, не 0.2.0: песочница инструментов, проверка хешей Ollama, аудиты зависимостей и SBOM ещё не готовы.

            Файлы называются Ulei_: Windows `Ulei_0.1.2_x64-setup.exe` и MSI, macOS `Ulei_0.1.2_aarch64.dmg`, Linux `Ulei_0.1.2_amd64.AppImage` и deb. macOS подписан ad-hoc. Если Gatekeeper пишет «повреждено»: `xattr -cr "/Applications/Улей.app"` или правый клик → «Открыть».
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          assetNamePattern: "Ulei_[version]_[arch][setup][ext]"
          args: --bundles ${{ matrix.bundles }}
      - name: Verify the ad-hoc signature
        if: matrix.os == 'macos-latest'
        env:
          REQUIRE_UPDATER_ARCHIVE: "1"
        run: bash desktop/verify-macos-sign.sh
