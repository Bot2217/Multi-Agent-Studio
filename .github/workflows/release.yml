name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "app.py"
      - "core/**"
      - "tools/**"
      - "config/**"
      - "api/**"
      - "contracts/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages for Tauri
        run: bash desktop/ci-apt.sh
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Frozen sidecar serves health outside the checkout
        run: python3 desktop/smoke_sidecar.py
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Build an AppImage
        working-directory: desktop
        run: npm run tauri build -- --bundles appimage

  macos-sign:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Frozen sidecar serves health outside the checkout
        run: python3 desktop/smoke_sidecar.py
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Build the signed app
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles app
      - name: Verify the ad-hoc signature
        run: bash desktop/verify-macos-sign.sh

  windows-sidecar:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Frozen sidecar serves health outside the checkout
        run: python desktop/smoke_sidecar.py
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Build the NSIS installer
        working-directory: desktop
        run: npm run tauri build -- --bundles nsis
      - name: Install into a folder with Cyrillic and a space, then require health
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop\windows\smoke-nsis.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux packages for Tauri
        if: matrix.os == 'ubuntu-latest'
        run: bash desktop/ci-apt.sh
      - name: Freeze the Python sidecar
        run: bash desktop/build-backend.sh
      - name: Frozen sidecar serves health outside the checkout
        run: python3 desktop/smoke_sidecar.py
      - name: Install the desktop shell
        working-directory: desktop
        run: npm ci
      - name: Put the updater public key into the build
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python3 desktop/inject_updater_key.py --require
      - name: Use an ad-hoc Apple signing identity
        if: matrix.os == 'macos-latest'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Publish a draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: Улей ${{ github.ref_name }}
          releaseBody: |
            Обновление для установленной 0.1.2 приходит само: при запуске «Улей» предложит «Установить и перезапустить».

            0.1.2 после установки не открывала студию. Окно оставалось на «Запускаю улей…», потому что упакованный ulei-backend.exe сразу завершался: ModuleNotFoundError: No module named 'api'. Сборщик искал модули только в каталоге desktop и не клал пакет api в архив. 0.1.3 кладёт api и остальные пакеты репозитория в sidecar.

            Если фоновый процесс всё же закроется, заставка больше не крутится без конца. Окно показывает текст ошибки, последние строки вывода и путь к журналу, и предлагает «Повторить». Журнал Windows: %LOCALAPPDATA%\ulei\logs\sidecar.log. В нём записаны фактические адреса health; порт выбирается при запуске.

            Установщик по-прежнему перед заменой файлов закрывает только эту копию: ulei.exe и ulei-backend.exe в папке установки. Настройки в %APPDATA%\ulei и локальные модели не удаляются.

            Это патч 0.1.3, не 0.2.0: песочница инструментов, проверка хешей Ollama, аудиты зависимостей и SBOM ещё не готовы.

            Файлы называются Ulei_: Windows `Ulei_0.1.3_x64-setup.exe` и MSI, macOS `Ulei_0.1.3_aarch64.dmg`, Linux `Ulei_0.1.3_amd64.AppImage` и deb. macOS подписан ad-hoc. Если Gatekeeper пишет «повреждено»: `xattr -cr "/Applications/Улей.app"` или правый клик → «Открыть».
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          assetNamePattern: "Ulei_[version]_[arch][setup][ext]"
          args: --bundles ${{ matrix.bundles }}
      - name: Verify the ad-hoc signature
        if: matrix.os == 'macos-latest'
        env:
          REQUIRE_UPDATER_ARCHIVE: "1"
        run: bash desktop/verify-macos-sign.sh
      - name: Install the Windows package and require sidecar health
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File desktop\windows\smoke-nsis.ps1
