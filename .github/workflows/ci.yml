name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update path fast-forwards a real clone and survives failure
        shell: cmd
        run: tests\windows_update_probe.cmd
      - name: Launcher setup creates the venv and installs dependencies
        shell: cmd
        run: start.bat setup
      - name: Virtualenv can import Streamlit
        shell: cmd
        run: .venv\Scripts\python.exe -c "import streamlit; print(streamlit.__version__)"
