# Multi-Agent Studio — конфигурация ролей
# Можно править вручную или через UI. Переопределения UI → user_settings.json

# Алиасы ниже дублируют config/models_catalog.yaml для ролей по умолчанию.
# Полный список, цены и free/paid — в каталоге. Каталог побеждает при расхождении.
models:
  gemini_38_flash: gemini/gemini-3.8-flash
  gemini_25_flash: gemini/gemini-2.5-flash
  gemini_25_flash_lite: gemini/gemini-2.5-flash-lite
  gemini_25_pro: gemini/gemini-2.5-pro
  or_gemma_4_31b: openrouter/google/gemma-4-31b-it:free
  or_nemotron_ultra: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
  or_nemotron_lightning: openrouter/nvidia/nemotron-3.5-lightning:free
  deepseek_flash: deepseek/deepseek-flash
  groq_gpt_oss_120b: groq/openai/gpt-oss-120b
  groq_gpt_oss_20b: groq/openai/gpt-oss-20b
  claude_haiku_55: anthropic/claude-haiku-5-5
  claude_sonnet_55: anthropic/claude-sonnet-5-5
  claude_opus_55: anthropic/claude-opus-5-5
  gpt_61_terra: openai/gpt-6.1-terra
  gpt_61_sol: openai/gpt-6.1-sol
  gpt_4o_mini: openai/gpt-4o-mini
  grok_47: xai/grok-4.7

recommendations:
  manager: [gemini_38_flash, gemini_25_flash, claude_sonnet_55, gpt_61_terra]
  researcher: [gemini_25_flash, or_gemma_4_31b, gemini_25_pro, claude_haiku_55]
  architect: [gemini_25_pro, gemini_38_flash, claude_sonnet_55, gpt_61_sol]
  developer: [gemini_38_flash, or_nemotron_ultra, deepseek_flash, groq_gpt_oss_120b, claude_sonnet_55]
  reviewer: [gemini_25_pro, grok_47, claude_opus_55, gpt_61_sol]
  tester: [gemini_25_flash_lite, or_nemotron_lightning, groq_gpt_oss_20b, gpt_4o_mini]

agents:
  manager:
    name: "Менеджер"
    description: "Разбивает задачу на подзадачи, решает порядок, собирает итог"
    enabled: true
    model: gemini_38_flash
    temperature: 0.2
    tools: []
    system: |
      Ты менеджер мультиагентной команды.
      Получаешь задачу пользователя и краткие отчёты от других агентов.
      Твоя работа: разбить задачу на ясные шаги, указать кому что делать,
      в конце собрать итог. Не пиши код. Не вызывай инструменты.
      Отвечай кратко на русском.

  researcher:
    name: "Исследователь"
    description: "Анализ, поиск по файлам, сбор фактов"
    enabled: true
    model: gemini_25_flash
    temperature: 0.3
    tools: [list_dir, read_file, search_text]
    system: |
      Ты исследователь. Изучаешь workspace, читаешь файлы, ищешь по тексту.
      Собираешь факты и требования. Не пишешь и не меняешь код.
      Не запускаешь shell. В конце кратко резюмируй находки на русском.

  architect:
    name: "Архитектор"
    description: "План структуры, файлы, API, порядок реализации"
    enabled: true
    model: gemini_25_pro
    temperature: 0.25
    tools: [list_dir, read_file, search_text]
    system: |
      Ты архитектор ПО. На основе задачи и отчёта исследователя
      предлагаешь структуру файлов, модули, интерфейсы, порядок работ.
      Не пишешь полный код — только план и псевдокод при необходимости.
      Отвечай на русском.

  developer:
    name: "Разработчик"
    description: "Код, файлы, shell, SSH"
    enabled: true
    model: gemini_38_flash
    temperature: 0.15
    tools:
      - list_dir
      - read_file
      - write_file
      - append_file
      - delete_path
      - move_path
      - copy_path
      - search_text
      - run_shell
      - remote_list
      - remote_add
      - remote_run
      - remote_ping
      - power_status
      - power_start
      - power_stop
    system: |
      Ты разработчик (как Claude Code). Пишешь и правишь код в workspace,
      запускаешь shell, при необходимости работаешь по SSH.
      Перед перезаписью/удалением система сама делает backup.
      Работай по плану архитектора. Отвечай на русском, кратко.

  reviewer:
    name: "Ревьюер"
    description: "Проверка кода, баги, стиль, безопасность"
    enabled: true
    model: gemini_25_pro
    temperature: 0.1
    tools: [list_dir, read_file, search_text, run_shell]
    system: |
      Ты code-reviewer. Проверяешь результат разработчика:
      ошибки, краевые случаи, безопасность, читаемость.
      Можешь запускать shell для проверки. Не переписывай всё с нуля —
      укажи конкретные правки. Отвечай на русском.

  tester:
    name: "Тестировщик"
    description: "Запуск тестов, smoke-check"
    enabled: false
    model: gemini_25_flash_lite
    temperature: 0.1
    tools: [list_dir, read_file, run_shell, write_file]
    system: |
      Ты тестировщик. Пишешь/запускаешь простые проверки в workspace.
      Сообщай pass/fail. Отвечай на русском.

pipelines:
  full:
    description: "Полный цикл: план → исследование → архитектура → код → ревью"
    steps: [manager, researcher, architect, developer, reviewer]
  code_only:
    description: "Быстрый код: разработка → ревью"
    steps: [developer, reviewer]
  research_code:
    description: "Исследование и код"
    steps: [researcher, developer, reviewer]
  single:
    description: "Один агент (developer)"
    steps: [developer]

default_pipeline: code_only
